<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YAAB 三联同屏 · 原版 | 全局调色拟合 | 注入</title>
<style>
  :root {
    --bg: #0c0e12;
    --fg: #e8eaed;
    --muted: #9aa0a6;
    --accent: #5b9fd4;
    --bar: #1a1f28;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap {
    max-width: 1280px; margin: 0 auto; padding: 16px 20px 32px;
  }
  h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 0.82rem; margin-bottom: 14px; line-height: 1.45; }
  .stage {
    position: relative; width: 100%;
    aspect-ratio: 16 / 9;
    background: #000; border-radius: 4px; overflow: hidden;
    user-select: none; touch-action: none;
  }
  .stage video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    pointer-events: none;
  }
  /* dual wipe: left=vanilla, mid=graded, right=inject */
  #v-vanilla { clip-path: inset(0 calc(100% - var(--x1)) 0 0); z-index: 1; }
  #v-graded  { clip-path: inset(0 calc(100% - var(--x2)) 0 var(--x1)); z-index: 2; }
  #v-inject  { clip-path: inset(0 0 0 var(--x2)); z-index: 3; }
  .handle {
    position: absolute; top: 0; bottom: 0; width: 2px;
    background: rgba(255,255,255,0.85); z-index: 10;
    transform: translateX(-50%);
    pointer-events: none;
  }
  .handle::before {
    content: "";
    position: absolute; top: 50%; left: 50%;
    width: 18px; height: 18px;
    margin: -9px 0 0 -9px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 2px rgba(0,0,0,0.35);
  }
  #h1 { left: var(--x1); }
  #h2 { left: var(--x2); }
  .labels {
    position: absolute; left: 0; right: 0; top: 10px;
    display: flex; justify-content: space-between;
    padding: 0 12px; z-index: 12; pointer-events: none;
    font-size: 0.75rem; font-weight: 600;
    text-shadow: 0 1px 3px #000;
  }
  .labels span {
    background: rgba(0,0,0,0.45); padding: 3px 8px; border-radius: 3px;
  }
  .bar {
    margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    background: var(--bar); padding: 10px 12px; border-radius: 4px;
  }
  button {
    background: #2a3340; color: var(--fg); border: 1px solid #3a4454;
    padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 0.85rem;
  }
  button:hover { background: #354050; }
  input[type="range"] { flex: 1; min-width: 120px; accent-color: var(--accent); }
  .t { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.8rem; min-width: 9ch; }
</style>
</head>
<body>
<div class="wrap">
  <h1>YAAB 三联同屏滑条</h1>
  <p class="meta">
    左：原版 · 中：全局调色拟合（br0.0064 / con0.984 / sat1.015 / gam1.349）· 右：注入<br />
    已按既定锚点裁切：注入 @31.0s · 原版 @35.3667s（Δ≈262f），启动/UI 已截去。
  </p>
  <div class="stage" id="stage" style="--x1: 33.333%; --x2: 66.666%;">
    <video id="v-vanilla" src="yaab-wipe-vanilla.mp4" muted playsinline preload="auto"></video>
    <video id="v-graded"  src="yaab-wipe-graded.mp4"  muted playsinline preload="auto"></video>
    <video id="v-inject"  src="yaab-wipe-inject.mp4"  muted playsinline preload="auto"></video>
    <div class="handle" id="h1"></div>
    <div class="handle" id="h2"></div>
    <div class="labels">
      <span>原版</span>
      <span>全局调色拟合</span>
      <span>注入</span>
    </div>
  </div>
  <div class="bar">
    <button id="play" type="button">播放</button>
    <input id="seek" type="range" min="0" max="1000" value="0" />
    <span class="t" id="time">0.0 / 0.0</span>
  </div>
</div>
<script>
(function () {
  const stage = document.getElementById("stage");
  const vids = [
    document.getElementById("v-vanilla"),
    document.getElementById("v-graded"),
    document.getElementById("v-inject"),
  ];
  const seek = document.getElementById("seek");
  const playBtn = document.getElementById("play");
  const timeEl = document.getElementById("time");
  let x1 = 1 / 3, x2 = 2 / 3;
  let drag = null; // 1 | 2
  let playing = false;

  function setSplits(a, b) {
    x1 = Math.max(0.05, Math.min(a, b - 0.05));
    x2 = Math.min(0.95, Math.max(b, x1 + 0.05));
    stage.style.setProperty("--x1", (x1 * 100).toFixed(3) + "%");
    stage.style.setProperty("--x2", (x2 * 100).toFixed(3) + "%");
  }

  function ptrRatio(e) {
    const r = stage.getBoundingClientRect();
    const cx = e.clientX != null ? e.clientX : e.touches[0].clientX;
    return Math.max(0, Math.min(1, (cx - r.left) / r.width));
  }

  function nearestHandle(t) {
    return Math.abs(t - x1) <= Math.abs(t - x2) ? 1 : 2;
  }

  function onDown(e) {
    e.preventDefault();
    const t = ptrRatio(e);
    drag = nearestHandle(t);
    if (drag === 1) setSplits(t, x2); else setSplits(x1, t);
  }
  function onMove(e) {
    if (!drag) return;
    e.preventDefault();
    const t = ptrRatio(e);
    if (drag === 1) setSplits(t, x2); else setSplits(x1, t);
  }
  function onUp() { drag = null; }

  stage.addEventListener("pointerdown", onDown);
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
  stage.addEventListener("touchstart", onDown, { passive: false });
  window.addEventListener("touchmove", onMove, { passive: false });
  window.addEventListener("touchend", onUp);

  function master() { return vids[0]; }

  function syncFrom(t) {
    for (const v of vids) {
      if (Math.abs(v.currentTime - t) > 0.04) v.currentTime = t;
    }
  }

  function updateTime() {
    const m = master();
    const d = m.duration || 0;
    const t = m.currentTime || 0;
    if (d && !seek.matches(":active")) {
      seek.value = String(Math.round((t / d) * 1000));
    }
    timeEl.textContent = t.toFixed(1) + " / " + d.toFixed(1);
  }

  playBtn.addEventListener("click", () => {
    playing = !playing;
    if (playing) {
      const t = master().currentTime;
      for (const v of vids) { v.currentTime = t; v.play(); }
      playBtn.textContent = "暂停";
    } else {
      for (const v of vids) v.pause();
      playBtn.textContent = "播放";
    }
  });

  seek.addEventListener("input", () => {
    const m = master();
    if (!m.duration) return;
    const t = (Number(seek.value) / 1000) * m.duration;
    for (const v of vids) { v.pause(); v.currentTime = t; }
    playing = false;
    playBtn.textContent = "播放";
    updateTime();
  });

  master().addEventListener("timeupdate", () => {
    if (playing) syncFrom(master().currentTime);
    updateTime();
  });
  master().addEventListener("loadedmetadata", updateTime);

  // keep graded/inject locked to vanilla clock drift
  setInterval(() => {
    if (!playing) return;
    const t = master().currentTime;
    for (let i = 1; i < vids.length; i++) {
      if (Math.abs(vids[i].currentTime - t) > 0.08) vids[i].currentTime = t;
    }
  }, 250);

  setSplits(x1, x2);
})();
</script>
</body>
</html>
