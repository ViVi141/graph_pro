name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax (no imports executed)
        shell: pwsh
        run: |
          python -m compileall -q tools
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 -File |
            Where-Object { $_.FullName -notmatch '\\_local\\' } |
            ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              foreach ($e in @($errors)) {
                Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
                $failed = $true
              }
            }
          if ($failed) { exit 1 }

      - name: No personal paths or email
        shell: pwsh
        run: |
          # Matches both literal and JSON-escaped separators: C:\Users\name and C:\\Users\\name.
          # The single-backslash-only version of this rule silently passed the
          # extract/bench_7900x/*.json files, which store paths JSON-escaped.
          $patterns = @(
            '[A-Za-z]:\\{1,2}Users\\{1,2}[A-Za-z0-9._-]+',
            'SteamLibrary',
            '/home/[a-z0-9_]{2,}',
            '[A-Za-z0-9._%+-]+@(qq|gmail|outlook|hotmail|163|126|foxmail|sina)\.'
          )
          $hits = @()
          foreach ($p in $patterns) {
            # Exclude this file: it necessarily contains the patterns it looks for.
            $hits += @(git grep -n -I -E $p -- . ':!.github/workflows/ci.yml' 2>$null)
          }
          # Attribution address on PRIVACY.md is a GitHub noreply alias, not personal data.
          $hits = @($hits | Where-Object { $_ -notmatch '@users\.noreply\.github\.com' })
          if ($hits.Count -gt 0) {
            $hits
            Write-Host "::error::personal data found in tracked files"
            exit 1
          }
          Write-Host "privacy guard: clean"
